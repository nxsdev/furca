name: Deploy

# Deploys kuji to your Cloudflare account with Alchemy (Worker + D1 + KV; D1 migrations are applied).
# Required repository secrets: CLOUDFLARE_API_TOKEN, BETTER_AUTH_SECRET, ENCRYPTION_KEY
# Required repository variable: CLOUDFLARE_ACCOUNT_ID
# API token permissions (account): Workers Scripts Write, D1 Write, Workers KV Storage Write,
# Secrets Store Write, Account Settings Write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Check Cloudflare credentials
        run: bun alchemy provider check-env --provider Cloudflare
      - name: Deploy
        run: bun alchemy deploy packages/infra/alchemy.run.ts --stage prod --yes
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
